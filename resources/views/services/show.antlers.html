<div class="wc-main-body">
		<div data-scroll class="page">
			<main>
				<div class="content">

					<!-- start-wp-service-section -->
					<section class="wp-service-detail-section">
						<div class="container">
							<div class="col-12 border_full_width_top">
								<h3 data-aos="fade-right" data-aos-duration="1000">{{ title }}</h3>
								<div class="wp-service-detail-wrapper">
									<div class="wp-service-detail-content">
										<div class="wp-service-detail-img img-cover" data-aos="flip-up" data-aos-duration="1000">
											<img src="{{ image:url ?? '/assets/images/images-12.jpg' }}" alt="{{ title }}">
										</div>
										<p data-aos="fade-up" data-aos-duration="1000" class="wp-service-detail-title">{{ excerpt }}</p>
										{{ content }}
										<ul>
											<li data-aos="fade-up" data-aos-duration="1000">A one-page brief before any drawing starts.</li>
											<li data-aos="fade-up" data-aos-duration="1000">Applications tested at the size they will be seen.</li>
											<li data-aos="fade-up" data-aos-duration="1000">A kit the next designer can open without us.</li>
											<li data-aos="fade-up" data-aos-duration="1000">Handoff with files, licences, and a named owner.</li>
										</ul>
										<div class="wp-service-work-detail">
											<h5>Are you ready to work with us?</h5>
											<a class="btn-primary btn js-contact-link" href="/contact">Get in touch<span><img src="/assets/images/btn-arrow.png" alt=""></span></a>
										</div>
									</div>
								</div>
							</div>
						</div>
					</section>
					<!-- close-wp-service-section -->

				</div>
			</main>
		</div>
	</div>

	<div class="cursor">
		<div class="cursor__inner cursor__inner--circle"></div>
		<div class="cursor__inner cursor__inner--dot"></div>
	</div>
