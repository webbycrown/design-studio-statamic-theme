<div id="test-form" class="wp-newsletter-section career-popup mfp-hide">
    <h2 class="sub_title">Career Apply Form</h2>
    <div class="wp-newsletter-content">
        {{ form:career action="/!/forms/career" class="js-theme-form" }}
            <div class="stay-connect-alert stay-connect-alert--error" hidden></div>
            <div class="stay-connect-success" hidden>
                <p>Thanks — your application was sent.</p>
            </div>
            <div class="stay-connect-fields">
                <div class="custom-input-group">
                    <input class="custom-input" type="text" name="first_name" placeholder="First name" required>
                    <input class="custom-input" type="text" name="last_name" placeholder="Last name" required>
                </div>
                <div class="custom-input-group">
                    <input class="custom-input" type="email" name="email" placeholder="Email" required>
                    <input class="custom-input" type="text" name="phone" placeholder="Phone" required>
                </div>
                <input class="custom-input js-career-role" type="text" name="role" placeholder="Role" readonly>
                <textarea class="custom-textarea" name="resume" placeholder="resume" required></textarea>
                <input type="text" class="js-honeypot" name="honeypot" tabindex="-1" autocomplete="off">
                <button type="submit" class="btn-primary btn">
                    <span class="btn-label">Submit</span>
                    <span class="btn-loading" hidden>Sending…</span>
                    <span><img src="/assets/images/btn-arrow.png" alt=""></span>
                </button>
            </div>
        {{ /form:career }}
    </div>
</div>
