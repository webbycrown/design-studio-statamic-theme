<!-- services_list section (home style - text list with links) -->
<section class="wp-service-section border_full_width_top">
    <div class="container">
        <div class="col-12">
            <h2 class="sub_title" data-aos="fade-up" data-aos-duration="1000">{{ heading ?? 'Services' }}<span class="star-shape"><img src="/assets/images/star-shape.png" alt=""></span></h2>
            <div class="wp-service-wrapper">
                {{ if intro }}<p data-aos="fade-up" data-aos-duration="1000">{{ intro }}</p>{{ /if }}
                <ul class="wp-service-box">
                    {{ collection:services sort="title:asc" }}
                    <li data-aos="zoom-in" data-aos-duration="1000">
                        <a href="{{ url }}">
                            <span>{{ title }}</span>
                            <span><img src="/assets/images/service-arrow.png" alt=""></span>
                        </a>
                    </li>
                    {{ /collection:services }}
                </ul>
            </div>
        </div>
    </div>
</section>
