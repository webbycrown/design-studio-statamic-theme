{{ form:contact action="/!/forms/contact" class="js-theme-form" }}
    <div class="stay-connect-alert stay-connect-alert--error" hidden></div>
    <div class="stay-connect-success" hidden>
        <p>Thanks — we received your message and will reply shortly.</p>
    </div>
    <div class="stay-connect-fields">
        <div class="custom-input-group">
            <input class="custom-input" type="text" name="name" placeholder="name" value="{{ old:name }}" required>
            <input class="custom-input" type="text" name="project_name" placeholder="Project name" value="{{ old:project_name }}">
        </div>
        <div class="custom-input-group">
            <input class="custom-input" type="email" name="email" placeholder="Email" value="{{ old:email }}" required>
            <input class="custom-input" type="text" name="phone" placeholder="Phone" value="{{ old:phone }}">
        </div>
        <textarea class="custom-textarea" name="message" placeholder="Message" required>{{ old:message }}</textarea>
        <input type="text" class="js-honeypot" name="honeypot" tabindex="-1" autocomplete="off">
        <button type="submit" class="btn-primary btn">
            <span class="btn-label">Send</span>
            <span class="btn-loading" hidden>Sending…</span>
            <span><img src="/assets/images/btn-arrow.png" alt=""></span>
        </button>
    </div>
{{ /form:contact }}
