<!-- home_hero section -->
<section class="home-hero-section">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="main-home-hero-contant border_full_width_bottom">
                    <div class="home-hero-contant">
                        <h1 data-aos="flip-up" data-aos-duration="1000">{{ heading ?? 'Brand Designer' }} <span class="star-shape"><img src="/assets/images/star-shape.png" alt=""></span></h1>
                        <h3 data-aos="fade-right" data-aos-duration="1000">{{ accent_word ?? 'Studio' }}</h3>
                        <p data-aos="fade-up" data-aos-duration="1000">{{ text }}</p>
                        <div class="hero-btn-wrapper" data-aos="fade-up" data-aos-duration="1000">
                            <a class="btn-primary btn popup-youtube" href="javascript:;">{{ button_label ?? 'How We Work' }} <span><i class="fa-solid fa-play"></i></span></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
